services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: givemepic-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: givemepic
            POSTGRES_USER: ${DB_USERNAME:-givemepic}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-givemepic_dev_password}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
