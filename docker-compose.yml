services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: givemepic-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: givemepic
            POSTGRES_USER: ${DB_USERNAME:-givemepic}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-givemepic_dev_password}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    minio:
        image: minio/minio:latest
        container_name: givemepic-minio
        restart: unless-stopped
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-givemepic}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-givemepic_dev_password}
        ports:
            - "9000:9000"
            - "9001:9001"
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data

volumes:
    postgres_data:
    minio_data:
