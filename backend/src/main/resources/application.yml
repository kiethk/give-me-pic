server:
    port: 8080

app:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
    cookie-secure: ${COOKIE_SECURE:false}
    base-url: ${APP_BASE_URL:http://localhost:8080}
    storage:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ROOT_USER:givemepic}
        secret-key: ${MINIO_ROOT_PASSWORD:givemepic_dev_password}
        bucket: ${MINIO_BUCKET:givemepic-media}
        presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:3600}

spring:
    application:
        name: backend
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/givemepic}
        username: ${DB_USERNAME:givemepic}
        password: ${DB_PASSWORD:givemepic_dev_password}
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    flyway:
        baseline-on-migrate: true
        baseline-version: 1

jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-production-1234567890}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
