server:
  port: 8080

app:
  # VERCEL_URL is added for when we deploy to Vercel
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000,http://192.168.1.92:3000}
  cookie-secure: ${COOKIE_SECURE:false}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  storage:
    endpoint: ${MINIO_ENDPOINT:https://viloijycgivaptvvzaly.storage.supabase.co/storage/v1/s3}
    region: ${MINIO_REGION:ap-northeast-2}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ROOT_USER:967ce5f4ae05a19589f90f58f6f34d7c}
    secret-key: ${MINIO_ROOT_PASSWORD:ecbacd096c4c33025246c80fa30441af1fa8e0d59d9c1cc464111f29b0eda1ae}
    bucket: ${MINIO_BUCKET:givemepic-media}
    presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:3600}
  media:
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:20971520}
  ocr:
    languages: ${TESSERACT_LANGUAGES:vie+eng}
    model: ${OCR_MODEL:gemini-3.1-flash-lite}
  embedding:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    output-dimensionality: ${GEMINI_EMBEDDING_DIMENSION:768}
  chat:
    gemini-api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.viloijycgivaptvvzaly}
    password: ${SPRING_DATASOURCE_PASSWORD:givemepic2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET:local-development-secret-change-before-production-1234567890}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
